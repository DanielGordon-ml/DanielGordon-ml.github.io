<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperative Multi-Agent Systems Without Communication | Daniel Gordon</title>
    <meta name="description" content="Exploring how agents can coordinate effectively without explicit communication channels.">
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --surface: #1e293b;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-secondary);
            background-color: var(--primary);
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 2rem;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .back-link:hover,
        .back-link:focus-visible {
            color: var(--secondary);
        }

        article {
            max-width: 750px;
            margin: 0 auto;
            padding: 7rem 2rem 4rem;
        }

        .post-meta {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        article h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .post-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .post-body p {
            margin-bottom: 1.5rem;
        }

        .coming-soon {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-top: 2rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-dim);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }

        *:focus-visible {
            outline: 2px solid var(--secondary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="../" class="nav-logo">DG</a>
        <a href="../#blog" class="back-link">&larr; Back to Blog</a>
    </nav>

    <article>
        <div class="post-meta">Coming Soon</div>
        <h1>Cooperative Multi-Agent Systems Without Communication</h1>
        <div class="post-body">
            <div class="coming-soon">
                This post is coming soon. Check back later for a deep dive into how agents can coordinate effectively without explicit communication channels.
            </div>
        </div>
    </article>

    <footer>
        &copy; 2026 Daniel Gordon
    </footer>

</body>
</html>
